:root{--bg:#0f1115;--panel:#16181d;--elev:#1c1f26;--hov:#232730;--bd:#2a2e38;--bd2:#363b47;--tx:#e6e8ec;--txd:#9096a3;--txm:#6b7280;--ac:#6366f1;--ach:#818cf8;--acs:rgba(99,102,241,.14);--dg:#ef4444;--ok:#10b981;--wn:#f59e0b;--paper:#fff;--ui:'Inter','SolaimanLipi','Kalpurush',sans-serif;--doc:'SolaimanLipi','Kalpurush',serif;--pw:8.5in;--ph:13in;--pt:4.2in;--pr:1in;--pb:1.2in;--pl:1.4in;--bf:14px;--lh:1.95;--pi:32px;--logo-h:90px;--sb-w:180px;--hdr-h:48px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select,textarea{font-family:inherit}

<body>
<div class="app">
<header class="hdr">
  <button class="btn icon" id="mobileMenuBtn" onclick="toggleSidebar()" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div class="brand"><div class="lg">B</div><span>BD STUDIO</span></div>
  <input class="dname" id="docNameTop" placeholder="Untitled document" onchange="onDocNameChange(this.value)" autocomplete="off">
  <div class="pill" id="modePill"><span class="dot"></span><span class="lbl" id="modeTxt">View</span></div>
  <div class="spacer"></div>
  <div class="hdr-actions">
    <button class="btn" id="editBtn" onclick="toggleEdit()" title="Toggle Edit (Ctrl+E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg><span class="lbl" id="editLabel">Edit</span></button>
    <button class="btn pri" onclick="saveDoc()" title="Save (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span class="lbl">Save</span></button>
    <button class="btn" onclick="doPrint()" title="Print (Ctrl+P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg><span class="lbl">Print</span></button>
  </div>
</header>
