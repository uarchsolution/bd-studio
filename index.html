<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>BD STUDIO</title>
<link rel="icon" id="faviconLink" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.maateen.me/solaiman-lipi/font.css">
<link rel="stylesheet" href="https://fonts.maateen.me/kalpurush/font.css">
<link rel="stylesheet" href="https://fonts.maateen.me/lohit-bengali/font.css">
<style>
:root{
  --bg:#0f1115;--panel:#16181d;--elev:#1c1f26;--hov:#232730;
  --bd:#2a2e38;--bd2:#363b47;
  --tx:#e6e8ec;--txd:#9096a3;--txm:#6b7280;
  --ac:#6366f1;--ach:#818cf8;--acs:rgba(99,102,241,.14);
  --dg:#ef4444;--ok:#10b981;--wn:#f59e0b;
  --paper:#fff;
  --ui:'Inter','SolaimanLipi','Kalpurush',sans-serif;
  --doc:'SolaimanLipi','Kalpurush',serif;
  --pw:8.5in;--ph:13in;
  --pt:4.2in;--pr:1in;--pb:1.2in;--pl:1.4in;
  --bf:14px;--lh:1.95;--pi:32px;
  --logo-h:90px;
  --sb-w:180px;
  --hdr-h:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b3039;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a4050}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--bd);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--ac);border-radius:50%;margin-top:-6px;cursor:pointer}
input[type=range]::-moz-range-track{height:4px;background:var(--bd);border-radius:2px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--ac);border-radius:50%;border:0;cursor:pointer}

/* ═══ APP SHELL ═══ */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

/* ═══ HEADER ═══ */
.hdr{display:flex;align-items:center;gap:8px;padding:0 12px;height:var(--hdr-h);background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;z-index:20;position:relative}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--tx);flex-shrink:0}
.brand .lg{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800;box-shadow:0 2px 8px rgba(99,102,241,.35)}
.dname{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 10px;color:var(--tx);font-size:12.5px;min-width:100px;max-width:240px;flex:1;transition:all .15s}
.dname:hover{background:var(--elev);border-color:var(--bd)}
.dname:focus{outline:none;background:var(--bg);border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--elev);border:1px solid var(--bd);border-radius:999px;font-size:11px;font-weight:600;color:var(--txd);flex-shrink:0;transition:all .2s}
.pill.on{background:var(--acs);border-color:rgba(99,102,241,.45);color:var(--ach)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--txm);transition:background .2s}
.pill.on .dot{background:var(--ac);box-shadow:0 0 8px var(--ac);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.spacer{flex:1;min-width:8px}
.btn{height:32px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:600;background:var(--elev);border:1px solid var(--bd);color:var(--tx);display:inline-flex;align-items:center;gap:6px;flex-shrink:0;transition:all .12s;white-space:nowrap;min-width:0}
.btn:hover{background:var(--hov);border-color:var(--bd2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:var(--ach)}
.btn.on{background:var(--acs);border-color:var(--ac);color:var(--ach)}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn.icon{padding:0 9px}
.btn.icon .lbl{display:none}
.hdr-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
#mobileMenuBtn{display:none;padding:0 10px}

/* ═══ RIBBON ═══ */
.ribbon{background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;display:flex;flex-direction:column}
.rtabs{display:flex;padding:0 8px;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtab{padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--txd);border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap;flex-shrink:0}
.rtab:hover{background:var(--hov);color:var(--tx)}
.rtab.on{color:var(--tx);border-bottom-color:var(--ac)}
.rbody{padding:8px 10px;display:flex;overflow-x:auto;overflow-y:hidden;min-height:88px;flex-shrink:0;scrollbar-width:thin}
.rpane{display:none;gap:0}
.rpane.on{display:flex}
.rgrp{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--bd);justify-content:center;align-items:center;gap:4px;flex-shrink:0}
.rgrp:last-child{border-right:0}
.rgrp .gr{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:220px}
.rgrp .gl{font-size:9px;color:var(--txm);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:2px}
.rtool{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:42px;height:52px;padding:4px 7px;border-radius:7px;color:var(--txd);font-size:9px;font-weight:600;gap:3px;transition:all .12s;white-space:nowrap;line-height:1.1;cursor:pointer}
.rtool:hover{background:var(--hov);color:var(--tx)}
.rtool:active{background:#2b3039;transform:translateY(1px)}
.rtool.on{background:var(--acs);color:var(--ach)}
.rtool svg{width:18px;height:18px;flex-shrink:0}
.rtool .lbl{font-size:9px;line-height:1;margin-top:1px;font-weight:600}
.rtool.sm{height:28px;min-width:30px;padding:2px 6px;font-size:12px;font-weight:700;flex-direction:row}
.rsel{height:28px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;color:var(--tx);padding:0 6px;font-size:11.5px;outline:none;max-width:150px;cursor:pointer}
.rsel:focus{border-color:var(--ac)}
.rnum{width:52px;height:28px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;color:var(--tx);padding:0 6px;font-size:11.5px;outline:none;text-align:center}
.rnum:focus{border-color:var(--ac)}

/* ═══ MAIN ═══ */
.main{display:flex;flex:1;min-height:0;overflow:hidden;position:relative}
.side{width:var(--sb-w);background:var(--panel);border-right:1px solid var(--bd);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;transition:transform .28s ease}
.st{padding:10px 14px 6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--txm);display:flex;justify-content:space-between;align-items:center}
.st .cnt{background:var(--elev);color:var(--txd);padding:1px 7px;border-radius:999px;font-size:10px;letter-spacing:0}
.ss{padding:0 8px 10px}
.th{display:flex;gap:8px;align-items:center;padding:6px;border-radius:6px;cursor:pointer;transition:background .12s;margin-bottom:2px}
.th:hover{background:var(--hov)}
.th.on{background:var(--acs)}
.th .num{width:20px;font-size:11px;color:var(--txm);text-align:center;flex-shrink:0;font-weight:600}
.th.on .num{color:var(--ach)}
.th .mini{width:48px;height:64px;background:var(--paper);border-radius:3px;border:1px solid var(--bd2);overflow:hidden;flex-shrink:0;position:relative;display:flex;align-items:flex-start;justify-content:center;padding:5px 3px}
.th .mini .lines{width:100%;display:flex;flex-direction:column;gap:2px}
.th .mini .line{height:2px;background:#d5d5d5;border-radius:1px}
.th .mini .line.short{width:60%}
.th .mini .line.med{width:80%}
.th.on .mini{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.th .lbl{font-size:11px;color:var(--txd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1.3}
.th.on .lbl{color:var(--tx)}
.canvas{flex:1;overflow:auto;background:var(--bg);position:relative;display:flex;flex-direction:column;align-items:center}
.cin{padding:32px 24px 80px;display:flex;flex-direction:column;align-items:center;min-height:100%;width:100%}
#docWrapper{display:flex;flex-direction:column;align-items:center;gap:24px;outline:none;transform-origin:top center;transition:transform .15s ease;max-width:100%}
#docWrapper[contenteditable="true"] .page{outline:2px solid rgba(99,102,241,.4);outline-offset:6px;cursor:text}
#docWrapper[contenteditable="true"] .page:focus-within{outline-color:var(--ac)}

/* ═══ PAGE ═══ */
.page{width:var(--pw);min-height:var(--ph);background:var(--paper);padding:var(--pt) var(--pr) var(--pb) var(--pl);box-shadow:0 1px 3px rgba(0,0,0,.35),0 10px 40px rgba(0,0,0,.5);position:relative;color:#111;font-family:var(--doc);font-size:var(--bf);line-height:var(--lh);overflow-wrap:break-word;flex-shrink:0;border-radius:2px;page-break-after:always;break-after:page}
.page:last-child{page-break-after:auto;break-after:auto}
.page .sr{position:absolute;top:0;left:0;right:0;height:var(--pt);border-bottom:1px dashed rgba(0,0,0,.12);pointer-events:none;display:flex;align-items:center;justify-content:center}
.page .sr::after{content:"স্ট্যাম্প / সিল এলাকা";font-family:var(--ui);font-size:11px;color:#c8c8c8;letter-spacing:1.5px;font-weight:600}
body.no-stamp .page .sr{display:none}
body.no-stamp .page{padding-top:1.8cm}
.page::after{content:"পৃষ্ঠা — " attr(data-page-num);position:absolute;bottom:.5in;left:0;right:0;text-align:center;font-size:11px;color:#999;font-family:var(--ui);letter-spacing:2px}
.page .logo-slot{display:flex;justify-content:center;align-items:center;margin-bottom:14px}
.page .logo-slot img{max-height:var(--logo-h);max-width:60%;object-fit:contain;display:block}
.page .logo-slot.empty{display:none}
body.logo-hidden .page .logo-slot{display:none}
.page .placeholder{color:#c8c8c8;font-family:var(--ui);font-size:13px;text-align:center;padding:40px 20px;font-style:italic;pointer-events:none;user-select:none}
.page .placeholder.hide{display:none}

/* ═══ DOC CONTENT ELEMENTS ═══ */
.doc-header{text-align:center;border-bottom:3px double #1a1a1a;padding-bottom:14px;margin-bottom:22px}
.doc-header h1{font-size:28px;font-weight:800;letter-spacing:1.5px;margin-bottom:6px;line-height:1.35}
.doc-header h2{font-size:13px;font-weight:500;letter-spacing:5px;color:#333;font-family:'Times New Roman',serif}
.chapter{text-align:center;font-size:16px;font-weight:700;margin:26px 0 16px;padding:7px 6px;border-top:2px solid #1a1a1a;border-bottom:2px solid #1a1a1a;line-height:1.6;background:linear-gradient(180deg,#fafafa,#fff);page-break-after:avoid;break-after:avoid}
.chapter:first-child{margin-top:0}
.clause{margin-bottom:15px;text-align:justify;page-break-inside:avoid;break-inside:avoid}
.clause-title{font-weight:700;font-size:calc(var(--bf) + .5px);margin-bottom:6px;line-height:1.7}
.clause p{text-indent:var(--pi);margin-bottom:8px;text-align:justify}
ol.powers{padding-left:34px;margin:8px 0}
ol.powers li{margin-bottom:5px;text-align:justify}
ul.sub{padding-left:34px;margin:6px 0 10px;list-style:none}
ul.sub li{margin-bottom:5px;text-align:justify}
.meta-table{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:13.5px}
.meta-table td{border:1px solid #1a1a1a;padding:8px 12px;vertical-align:top;line-height:1.75}
.meta-table td:first-child{width:26%;font-weight:700;background:#f4f4f4;font-family:var(--ui)}
.schedule-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.schedule-table th,.schedule-table td{border:1px solid #1a1a1a;padding:7px 10px;text-align:left;line-height:1.7}
.schedule-table th{background:#f0f0f0;font-weight:700;text-align:center;font-family:var(--ui)}
.witness-block{border:1px solid #1a1a1a;padding:14px 18px;margin:18px 0;page-break-inside:avoid}
.witness-block h3{text-align:center;font-size:14.5px;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #999;font-family:var(--ui)}
.witness-block table{width:100%;border-collapse:collapse;font-size:13.5px}
.witness-block table td{padding:6px 8px;vertical-align:bottom;line-height:1.7}
.witness-block table td:first-child{width:32%;font-weight:600;font-family:var(--ui)}
.witness-block table td:nth-child(2){border-bottom:1px dotted #555;min-height:22px}
.annexure{border:1px solid #1a1a1a;padding:14px 22px;margin:20px 0;page-break-inside:avoid}
.annexure h3{text-align:center;font-size:14.5px;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #999;font-family:var(--ui)}
.annexure ol{padding-left:30px}
.annexure ol li{margin-bottom:5px;font-size:13.5px;line-height:1.8}
.photo-section{display:flex;justify-content:space-around;margin:30px 0;flex-wrap:wrap;gap:20px}
.photo-box{width:200px;text-align:center}
.photo-box .box{width:150px;height:180px;border:2px dashed #444;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px;background:#fafafa;font-family:var(--ui);text-align:center;padding:8px}
.photo-box .label{font-size:12.5px;font-weight:600;font-family:var(--ui)}
.signature-section{display:flex;justify-content:space-between;margin:50px 0 20px;gap:20px;page-break-inside:avoid}
.sign-block{width:47%;text-align:center}
.sign-line{border-top:1px solid #1a1a1a;margin-top:60px;padding-top:6px;font-size:12.5px;font-weight:600;font-family:var(--ui);line-height:1.6}
.thumb-section{display:flex;justify-content:space-around;margin:28px 0;flex-wrap:wrap;gap:14px}
.thumb-box{width:150px;text-align:center}
.thumb-box .circle{width:95px;height:95px;border:2px dashed #444;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;color:#888;font-size:10.5px;background:#fafafa;font-family:var(--ui);text-align:center;padding:8px;line-height:1.4}
.thumb-box .label{font-size:11.5px;font-weight:600;font-family:var(--ui)}
.seal-row{display:flex;justify-content:space-between;margin:26px 0;gap:30px;page-break-inside:avoid}
.seal-box{width:45%;border:1px dashed #555;height:140px;padding:10px;font-size:12px;color:#777;font-family:var(--ui);text-align:center;display:flex;align-items:flex-end;justify-content:center;line-height:1.6}
.blank{min-height:1em;min-width:70px;display:inline-block;padding:1px 3px;border-radius:2px}
body.help-fields .blank{background:#fff9c4}
body.help-fields .blank:empty::before{content:"___ fill ___";color:#c66;font-size:11px}

/* ═══ STATUS BAR ═══ */
.status{height:30px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:0 14px;font-size:11.5px;color:var(--txd);flex-shrink:0;z-index:5;overflow-x:auto;scrollbar-width:none}
.status::-webkit-scrollbar{display:none}
.status .si{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.status .si b{color:var(--tx);font-weight:600}
.status .si.saved{color:#7fe5a0}
.status .spacer{flex:1;min-width:4px}
.zc{display:flex;align-items:center;gap:2px;flex-shrink:0}
.zc button{width:24px;height:24px;border-radius:5px;color:var(--txd);display:grid;place-items:center;font-size:15px;font-weight:600}
.zc button:hover{background:var(--hov);color:var(--tx)}
.zc .val{min-width:44px;text-align:center;font-size:11px;color:var(--tx);cursor:pointer;padding:3px 4px;border-radius:4px}
.zc .val:hover{background:var(--hov)}

/* ═══ MODALS ═══ */
.modal{position:fixed;inset:0;z-index:9600;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal.show{display:flex;animation:fadeIn .15s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mbox{background:var(--panel);border:1px solid var(--bd2);border-radius:14px;width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .18s ease-out}
@keyframes slideUp{from{transform:translateY(10px);opacity:.5}to{transform:translateY(0);opacity:1}}
.mhead{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);background:var(--elev);font-size:14px;font-weight:600;flex-shrink:0}
.mhead .x{width:28px;height:28px;border-radius:6px;color:var(--txd);display:grid;place-items:center;font-size:16px}
.mhead .x:hover{background:var(--hov);color:var(--tx)}
.mbody{padding:18px;overflow-y:auto;flex:1}
.mfoot{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;background:var(--elev);flex-shrink:0;flex-wrap:wrap}
.input{width:100%;height:36px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:0 12px;color:var(--tx);font-size:13px;outline:none;transition:all .15s}
.input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.lbl2{display:block;font-size:11px;color:var(--txm);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;margin-top:14px}
.lbl2:first-child{margin-top:0}
.list{max-height:260px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.li{padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;transition:background .12s}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hov)}
.li.on{background:var(--acs);border-left:3px solid var(--ac)}
.li .nm{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.li .meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.li .dt{font-size:10.5px;color:var(--txm);white-space:nowrap}
.li .sz{font-size:10px;color:var(--txm)}
.li .del{padding:5px 10px;border-radius:5px;color:var(--dg);font-size:11px;background:transparent;border:1px solid rgba(239,68,68,.3);transition:all .12s}
.li .del:hover{background:rgba(239,68,68,.15);border-color:var(--dg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .field{display:flex;flex-direction:column}
.g2 .field label{font-size:11px;color:var(--txd);display:block;margin-bottom:4px;font-weight:500}
.empty{padding:24px;text-align:center;color:var(--txm);font-size:12.5px}

/* ═══ FIND PANEL ═══ */
#findPanel{position:fixed;top:100px;right:20px;width:min(400px,94vw);background:var(--panel);border:1px solid var(--bd2);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.6);z-index:9500;display:none;overflow:hidden}
#findPanel.show{display:block;animation:slideUp .18s ease-out}
#findPanel .frow{display:flex;gap:8px;margin-bottom:10px;align-items:center}
#findPanel .frow label{min-width:70px;font-size:12px;color:var(--txm);font-weight:600}
#findPanel .ftogs{display:flex;gap:6px;margin-left:78px;margin-bottom:10px}
#findPanel .ftog{padding:4px 10px;border-radius:5px;background:var(--bg);border:1px solid var(--bd);font-size:11.5px;font-weight:600;color:var(--txd)}
#findPanel .ftog.on{background:var(--acs);border-color:var(--ac);color:var(--ach)}
#findPanel .fstat{display:flex;justify-content:space-between;font-size:12px;color:var(--txd);margin-bottom:10px}
#fpCount{font-weight:600;color:#fbbf24}
#fpCount.none{color:var(--dg)}
#findPanel .factions{display:flex;gap:6px;flex-wrap:wrap}
::highlight(find-all){background:#fff59d;color:#000}
::highlight(find-current){background:#fb923c;color:#fff}

/* ═══ TOAST ═══ */
#toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--tx);border:1px solid var(--bd2);border-radius:10px;padding:11px 20px;font-size:12.5px;font-weight:500;z-index:9999;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(16,185,129,.6)}
#toast.err{border-color:rgba(239,68,68,.65)}
#toast.warn{border-color:rgba(245,158,11,.6)}

/* ═══ BACKDROP ═══ */
#sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;opacity:0;transition:opacity .28s}
body.sb-open #sidebarBackdrop{display:block;opacity:1}

/* ═══ THEMES ═══ */
body.theme-navy{--ac:#3b82f6;--ach:#60a5fa;--acs:rgba(59,130,246,.14)}
body.theme-maroon{--ac:#e11d48;--ach:#fb7185;--acs:rgba(225,29,72,.14)}
body.theme-amber{--ac:#f59e0b;--ach:#fbbf24;--acs:rgba(245,158,11,.14)}
body.theme-emerald{--ac:#10b981;--ach:#34d399;--acs:rgba(16,185,129,.14)}

/* ═══ RESPONSIVE ═══ */
@media (max-width:900px){
  :root{--sb-w:240px;--hdr-h:46px}
  #mobileMenuBtn{display:inline-flex}
  .brand span{display:none}
  .hdr{gap:6px;padding:0 8px}
  .hdr-actions .btn .lbl{display:none}
  .hdr-actions .btn{padding:0 9px}
  .dname{min-width:0;max-width:150px;font-size:12px}
  .pill{padding:3px 8px;font-size:10.5px}
  .pill .lbl{display:none}
  .side{position:fixed;top:0;bottom:0;left:0;z-index:10;transform:translateX(-100%);box-shadow:6px 0 24px rgba(0,0,0,.6);padding-top:var(--hdr-h)}
  body.sb-open .side{transform:translateX(0)}
  .cin{padding:20px 12px 60px}
  .rbody{min-height:82px}
  .rtool{min-width:38px;height:48px;padding:3px 6px}
  .rtool svg{width:16px;height:16px}
  .rtab{padding:8px 12px;font-size:12px}
  #findPanel{left:8px;right:8px;width:auto;top:88px}
  .status{gap:10px;padding:0 10px;font-size:11px}
}

@media (max-width:600px){
  :root{--hdr-h:44px}
  .hdr{gap:4px;padding:0 6px}
  .brand .lg{width:22px;height:22px;font-size:11px}
  .btn{height:30px;padding:0 9px;font-size:12px;gap:4px}
  .btn svg{width:13px;height:13px}
  .dname{padding:4px 6px;font-size:11.5px;max-width:100px}
  .pill{padding:3px 6px;font-size:10px;gap:4px}
  .pill .lbl{display:none}
  .status{height:26px;padding:0 8px;gap:8px;font-size:10.5px}
  .status .si.hide-sm{display:none}
  .cin{padding:14px 6px 50px}
  .rgrp{padding:0 6px}
  .rgrp .gr{max-width:150px}
  .rtool{min-width:34px;height:44px;padding:2px 5px}
  .rtool .lbl{font-size:8px}
  .rtool svg{width:15px;height:15px}
  .rtab{padding:7px 10px;font-size:11.5px}
  .mhead{padding:12px 14px;font-size:13px}
  .mbody{padding:14px}
  .mfoot{padding:10px 14px}
  #findPanel .frow label{min-width:50px;font-size:11px}
  #findPanel .ftogs{margin-left:0;padding-left:58px}
  .g2{grid-template-columns:1fr}
}

/* ═══ PRINT ═══ */
@media print{
  @page{size:8.5in 13in;margin:0}
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  .hdr,.ribbon,.side,.status,.modal,#findPanel,#toast,#sidebarBackdrop,#mobileMenuBtn{display:none!important}
  .app{display:block;height:auto;overflow:visible}
  .main{display:block;overflow:visible;height:auto}
  .canvas{overflow:visible;background:#fff;display:block;width:auto;height:auto}
  .cin{padding:0;display:block;width:auto;min-height:auto}
  #docWrapper{display:block;width:auto!important;height:auto!important;transform:none!important;gap:0}
  .page{width:8.5in!important;height:13in!important;min-height:13in!important;box-shadow:none!important;margin:0!important;page-break-after:always;break-after:page;outline:none!important;border-radius:0!important;overflow:hidden}
  .page:last-child{page-break-after:auto;break-after:auto}
  .page .sr{border-bottom:1px dashed #ccc!important;background:#fff!important}
  .page .sr::after{display:none!important}
  .page .placeholder{display:none!important}
  body.no-stamp .page{padding-top:1.8cm!important}
  body.help-fields .blank{background:transparent!important}
  body.help-fields .blank:empty::before{display:none!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style>
